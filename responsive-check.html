<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Responsive verification</title><style>body{margin:0;background:#e8e8e8;font:14px Arial}header{padding:12px;display:flex;gap:20px;align-items:center;background:white;position:sticky;top:0;z-index:2}select,button{padding:8px}iframe{display:block;border:0;background:#0b100e;height:900px}pre{white-space:pre-wrap;background:white;padding:15px}</style></head><body><header><label>Width <select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option><option>1920</option></select></label><label>Page <select id="page"><option value="/">Homepage</option><option value="/about">About</option><option value="/scholarship">Scholarship</option><option value="/practice">Practice</option><option value="/vlv-group">VLV Group</option><option value="/recognition">Recognition</option></select></label><button id="audit">Audit</button></header><iframe id="frame" title="Responsive site viewport" src="/" style="width:390px"></iframe><pre id="results">Ready</pre><script>
const f=document.getElementById('frame'),w=document.getElementById('width'),p=document.getElementById('page'),r=document.getElementById('results');w.addEventListener('change',()=>f.style.width=w.value+'px');p.addEventListener('change',()=>f.src=p.value);document.getElementById('audit').addEventListener('click',async()=>{const d=f.contentDocument,win=f.contentWindow;r.textContent='Running';await d.fonts.ready;await new Promise(resolve=>win.requestAnimationFrame(()=>win.requestAnimationFrame(resolve)));const images=[...d.images].filter(i=>i.getAttribute('src'));for(const img of images){img.loading='eager';try{await img.decode()}catch{}}const all=[...d.querySelectorAll('h1,h2,h3,a,button,img')].filter(e=>win.getComputedStyle(e).display!=='none'&&!e.closest('dialog,nav[aria-hidden="true"],[hidden]'));r.textContent=JSON.stringify({width:win.innerWidth,path:win.location.pathname,pageOverflow:d.documentElement.scrollWidth>win.innerWidth,failedImages:images.filter(i=>!i.naturalWidth).map(i=>i.getAttribute('src')),croppedImages:images.filter(i=>win.getComputedStyle(i).objectFit==='cover').map(i=>i.getAttribute('src')),filters:images.filter(i=>win.getComputedStyle(i).filter!=='none').map(i=>i.getAttribute('src')),clippedHeadings:all.filter(e=>/^H[123]$/.test(e.tagName)&&e.scrollWidth>e.clientWidth+2).map(e=>e.textContent),metrics:d.documentElement.dataset.metrics,title:d.title},null,2)});
</script></body></html>
