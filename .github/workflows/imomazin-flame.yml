name: Apply Imomazin flame identity
on:
  push:
    branches: [main]
    paths:
      - 'assets/imomazin-flame-patch.png'
      - 'scripts/apply-imomazin-flame.py'
      - '.github/workflows/imomazin-flame.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - run: python -m pip install 'Pillow==11.3.0'
      - run: python scripts/apply-imomazin-flame.py
      - name: Validate static brand assets
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          logo=Image.open('assets/imomazin-flame.png')
          assert logo.size==(1672,941)
          assert Image.open('assets/apple-touch-icon.png').size==(180,180)
          assert Image.open('assets/icon-512.png').size==(512,512)
          assert Path('favicon.ico').stat().st_size>1000
          PY
      - name: Commit generated branding assets
        run: |
          git add assets/imomazin-flame.png assets/imomazin-logo.png assets/apple-touch-icon.png assets/icon-16.png assets/icon-32.png assets/icon-48.png assets/icon-96.png assets/icon-192.png assets/icon-512.png favicon.ico favicon.png favicon.svg
          if ! git diff --cached --quiet; then
            git config user.name "Imomazin website automation"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Apply torch flame to Imomazin static brand assets"
            git push
          fi
