<!DOCTYPE html><html><head><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World preview checks</title><style>body{margin:0;background:#ddd;font:14px Arial}header{position:sticky;top:0;z-index:2;background:white;padding:10px;display:flex;gap:15px;align-items:center}select,button{padding:10px}iframe{display:block;height:900px;border:0;background:#07140f}pre{white-space:pre-wrap;background:white;padding:20px}</style></head><body><header><label>Width <select id="width"><option>320</option><option>390</option><option>768</option><option>1024</option><option selected>1363</option><option>1920</option></select></label><label>Scene <select id="scene"><option value="">Entrance</option><option value="about">Perspective</option><option value="international-engagement">International</option><option value="ecosystem">Ideas network</option><option value="ventures">VLV orbit</option></select></label><label><input type="checkbox" id="reduce">Reduced motion</label><button id="audit">Audit</button></header><iframe title="Website preview" id="preview" src="/world-preview" style="width:1363px"></iframe><pre id="results"></pre><script>const frame=document.querySelector('#preview'),width=document.querySelector('#width'),scene=document.querySelector('#scene'),reduce=document.querySelector('#reduce');function load(){frame.style.width=width.value+'px';frame.src='/world-preview'+(reduce.checked?'?motion=reduce':'')+(scene.value?'#'+scene.value:'')}width.onchange=scene.onchange=reduce.onchange=load;document.querySelector('#audit').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow;document.querySelector('#results').textContent=JSON.stringify({width:w.innerWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,headings:[...d.querySelectorAll('h1,h2')].map(e=>({text:e.textContent,clip:w.getComputedStyle(e).clipPath})),failedImages:[...d.images].filter(i=>i.getAttribute('src')&&i.complete&&!i.naturalWidth).map(i=>i.src),graphics:[...d.querySelectorAll('[data-graphic]')].map(e=>({type:e.dataset.graphic,frames:e.dataset.graphicFrame,width:e.clientWidth,height:e.clientHeight})),orbit:[...d.querySelectorAll('.xp-orbit-node')].map(e=>({left:e.getBoundingClientRect().left,right:e.getBoundingClientRect().right,transform:w.getComputedStyle(e.querySelector('a')).transform})),reduced:d.documentElement.dataset.motion},null,2)}</script></body></html>
